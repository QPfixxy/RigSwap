[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rigswap"
description = "Keep one copy of each game's graphics settings per hardware setup (handheld, eGPU dock, ...) and swap between them."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "QPfixxy" }]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
# Only for building installers (see packaging/); RigSwap itself doesn't need it
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
rigswap = "rigswap.cli:main"

[project.gui-scripts]
rigswap-gui = "rigswap.gui.app:main"

[project.urls]
Repository = "https://github.com/QPfixxy/RigSwap"

[tool.setuptools.dynamic]
version = { attr = "rigswap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rigswap.gui" = ["resources/icons/*.png", "resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
